<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lí Học Sinh</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Quản lí Học Sinh</h1>
      <button id="btn-add" class="btn btn-primary" aria-label="Thêm học sinh mới">
        + Thêm học sinh
      </button>
    </header>

    <!-- Search & filter bar -->
    <div class="toolbar">
      <input
        id="search-input"
        type="text"
        class="search-input"
        placeholder="Tìm theo tên hoặc lớp…"
        aria-label="Tìm kiếm học sinh"
      />
    </div>

    <!-- Student table -->
    <div class="table-wrapper" role="region" aria-label="Danh sách học sinh">
      <table id="student-table" class="student-table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Họ và tên</th>
            <th scope="col">Lớp</th>
            <th scope="col">Ngày sinh</th>
            <th scope="col">Giới tính</th>
            <th scope="col">Email</th>
            <th scope="col">Thao tác</th>
          </tr>
        </thead>
        <tbody id="student-tbody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
      <p id="empty-msg" class="empty-msg" hidden>Chưa có học sinh nào. Nhấn "Thêm học sinh" để bắt đầu.</p>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Thêm học sinh</h2>
        <button id="btn-close-modal" class="btn-icon" aria-label="Đóng">✕</button>
      </div>
      <form id="student-form" novalidate>
        <input type="hidden" id="field-id" />

        <div class="form-group">
          <label for="field-name">Họ và tên <span class="required">*</span></label>
          <input id="field-name" type="text" required maxlength="100" placeholder="Nguyễn Văn A" />
          <span class="field-error" id="err-name" role="alert"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-class">Lớp <span class="required">*</span></label>
            <input id="field-class" type="text" required maxlength="20" placeholder="10A1" />
            <span class="field-error" id="err-class" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="field-dob">Ngày sinh <span class="required">*</span></label>
            <input id="field-dob" type="date" required />
            <span class="field-error" id="err-dob" role="alert"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-gender">Giới tính</label>
            <select id="field-gender">
              <option value="">-- chọn --</option>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label for="field-email">Email</label>
            <input id="field-email" type="email" maxlength="100" placeholder="example@email.com" />
            <span class="field-error" id="err-email" role="alert"></span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn btn-secondary">Huỷ</button>
          <button type="submit" id="btn-submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm delete dialog -->
  <div id="confirm-overlay" class="modal-overlay" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
    <div class="modal modal--confirm">
      <h2 id="confirm-title" class="confirm-title">Xác nhận xoá</h2>
      <p id="confirm-msg" class="confirm-msg"></p>
      <div class="modal-actions">
        <button id="btn-confirm-cancel" class="btn btn-secondary">Không</button>
        <button id="btn-confirm-ok" class="btn btn-danger">Xoá</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/studentApp.js"></script>
</body>
</html>
